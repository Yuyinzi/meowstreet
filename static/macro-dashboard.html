<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meowstreet Macro Dashboard</title>
  <link rel="stylesheet" href="/macro-dashboard.css" />
</head>
<body>
  <main class="macro-shell" id="macroDashboardApp">
    <header class="macro-header">
      <div>
        <p class="eyebrow">Macro Dashboard</p>
        <h1>Market Phase</h1>
        <p class="subtitle">Bull and bear market status across method benchmark indices.</p>
      </div>
      <a class="workflow-link" href="/method-system.html">Ticker Workflow</a>
    </header>
    <section class="dashboard-status" id="dashboardStatus">Loading market phase data...</section>
    <section class="market-grid" id="marketGrid" aria-label="Benchmark market phase overview"></section>
    <section class="market-detail" id="marketDetail" aria-label="Selected benchmark detail"></section>
  </main>
  <script src="/macro-dashboard.js"></script>
</body>
</html>
