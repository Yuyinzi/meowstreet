<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meowstreet — Ticker Industry Context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ticker-context.css?v=5" />
  <link rel="stylesheet" href="/market-assistant.css?v=5" />
</head>
<body>
  <nav class="topnav">
    <a href="/" class="nav-brand">Meowstreet</a>
    <a href="/ticker-context.html" class="nav-link active">Ticker Context</a>
    <a href="/macro-dashboard.html" class="nav-link">Macro Dashboard</a>
    <a href="/portfolio.html" class="nav-link">Portfolio</a>
    <a href="/quant-screen.html" class="nav-link">Quant Screen</a>
  </nav>

  <main class="workflow-shell">
    <section class="graph-hero">
      <div class="hero-head">
        <h1>Ticker Industry Context</h1>
        <div class="hero-meta">GICS industry &amp; business-cycle tag</div>
      </div>

      <div class="command-card">
        <form id="lookupForm" class="lookup-form">
          <div class="ticker-row">
            <label class="ticker-field">
              <span>Symbol</span>
              <input type="text" name="symbol" placeholder="NVDA" required autocomplete="off" />
            </label>
            <label class="ticker-field">
              <span>Short leg (optional)</span>
              <input type="text" name="shortSymbol" placeholder="KO" autocomplete="off" />
            </label>
            <button type="submit" class="primary-button">Look up</button>
          </div>
        </form>
      </div>

      <div id="resultRegion" class="result-region" aria-live="polite"></div>
      <div id="pairRegion" class="result-region" aria-live="polite"></div>
      <div id="quantRegion" class="result-region" aria-live="polite"></div>

      <p class="provenance-note">
        Cyclical/Defensive tags: method-derived (2021 GICS vintage), mapped to current GICS industry names.
      </p>
    </section>
  </main>

  <button class="market-assistant-fab" id="marketAssistantFab" type="button" aria-label="Open Market Setup Assistant" aria-controls="marketAssistantWindow">
    <img src="/static/cat-icon.svg" alt="" aria-hidden="true" />
  </button>
  <div class="market-assistant-window" id="marketAssistantWindow" role="dialog" aria-label="Market Setup Assistant" aria-hidden="true">
    <div class="market-assistant-window-head" id="marketAssistantWindowHead">
      <h2>Market Setup Assistant</h2>
      <div class="market-assistant-window-actions">
        <button class="market-assistant-window-new" id="marketAssistantNewConversation" type="button" aria-label="Start new conversation">New conversation</button>
        <button class="market-assistant-window-close" id="marketAssistantWindowClose" type="button" aria-label="Close assistant">×</button>
      </div>
    </div>
    <div class="market-assistant-log" id="marketAssistantLog"></div>
    <form class="market-assistant-form" id="marketAssistantForm">
      <div class="market-assistant-input-row">
        <input type="text" id="marketAssistantQuestion" name="question" autocomplete="off" placeholder="e.g. What supports the current market setup?" />
        <button type="submit" id="marketAssistantSubmit">Ask</button>
      </div>
      <div class="market-assistant-controls">
        <label class="market-assistant-option">
          <input type="checkbox" id="marketAssistantExternalSearch" />
          <span>Search external sources</span>
        </label>
        <label class="market-assistant-option">
          <input type="checkbox" id="marketAssistantDeepResearch" />
          <span>Deep research</span>
        </label>
        <label class="market-assistant-option">
          <input type="checkbox" id="marketAssistantDeepAnalysis" />
          <span>Deep analysis</span>
        </label>
      </div>
    </form>
    <div class="market-assistant-status" id="marketAssistantStatus" aria-live="polite"></div>
    <div class="market-assistant-validation-disabled-notice" id="marketAssistantValidationDisabledNotice" aria-live="polite"></div>
    <div class="market-assistant-resize market-assistant-resize-n" data-edge="n" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-e" data-edge="e" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-s" data-edge="s" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-w" data-edge="w" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-ne" data-edge="ne" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-se" data-edge="se" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-sw" data-edge="sw" aria-hidden="true"></div>
    <div class="market-assistant-resize market-assistant-resize-nw" data-edge="nw" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/ticker-context.js?v=7"></script>
  <script src="/market-assistant.js?v=6"></script>
</body>
</html>
